[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certo"
version = "0.1.0"
description = "A laboratory for supporting mathematical proofs (CLI + MCP): decide, enumerate, optimise, synthesise and certify."
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12", "pulp>=2.7"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# Rigorous numerics for `bounds`. mpmath is the pure-Python fallback and is
# usually already present; python-flint (Arb) is faster and has the special
# functions, so it is preferred when installed.
numerics = ["python-flint>=0.6", "mpmath>=1.3"]

[project.scripts]
certo = "certo.cli:main"
certo-mcp = "certo.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certo = ["locales/*.json"]
