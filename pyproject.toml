[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certo"
version = "0.4.0"
description = "A laboratory for supporting mathematical proofs (CLI + MCP): decide, enumerate, optimise, synthesise and certify."
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12", "pulp>=2.7"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# Rigorous numerics for `bounds`, and the Gram-matrix search behind `sos`.
# mpmath is the pure-Python interval fallback; python-flint (Arb) is faster and
# has the special functions, so it is preferred when installed. numpy is not
# optional within this extra: `sos` searches for the Gram matrix by
# eigendecomposition, and without it there is nothing to search with.
numerics = ["python-flint>=0.6", "mpmath>=1.3", "numpy>=1.24"]

[project.scripts]
certo = "certo.cli:main"
certo-mcp = "certo.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certo = ["locales/*.json"]
